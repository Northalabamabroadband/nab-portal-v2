name: RC1 Build Validation

on:
  push:
    branches: [rc1-build004, rc1-build005, rc1-build006, rc1-build007]
  pull_request:
    branches: [main, rc1-build004, rc1-build005, rc1-build006]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: test
      APP_SECRET_KEY: test-only-secret-key-for-ci-validation
      DATABASE_URL: sqlite+pysqlite:///./test.db
      REDIS_URL: redis://localhost:6379/15
      BOOTSTRAP_ADMIN_PASSWORD: test-only-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m compileall app
      - run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package.json
      - run: npm install --no-audit --no-fund
      - run: npm run build

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose -f compose.rc1.yml config --quiet
      - run: ./deploy/validate-rc1.sh
